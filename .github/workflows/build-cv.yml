name: Build CV Documents
on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/build_cv.py'
      - '.github/workflows/build-cv.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: python .github/scripts/build_cv.py
      - name: Commit generated CVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/*.docx
          git diff --cached --quiet || git commit -m "Update CV documents"
          git push
